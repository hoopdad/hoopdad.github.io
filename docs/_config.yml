title: hoopdad dunks
tagline: Building agents that work. Understanding what they cost.
description: >-
  Original thinking and practical field notes on agents, AI engineering, and
  token economics. Built on a foundation of cloud architecture and data engineering.
baseurl: ""
url: "https://hoopdad.github.io"
lang: en
timezone: America/New_York
github_username: hoopdad
social:
  name: Mike Olivieri
  links:
    - https://www.linkedin.com/in/mikeolivieri1/
    - https://github.com/hoopdad
feedback_repository: hoopdad/hoopdad.github.io
feedback_discussion_category_helpful: helpful
feedback_discussion_category_needs_clarity: needs-clarity
feedback_discussion_category_found_issue: found-an-issue

markdown: kramdown
theme: jekyll-theme-chirpy
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Topic metadata must not alter categories: existing URLs include the directory category.
permalink: /:categories/:year/:month/:day/:title:output_ext
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      topic: ai-engineering
  - scope:
      path: tokenomics
      type: posts
    values:
      topic: tokenomics
  - scope:
      path: cloud
      type: posts
    values:
      topic: cloud
  - scope:
      path: data
      type: posts
    values:
      topic: data

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
sass:
  style: compressed
  sourcemap: never
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - substack-import.xml
  - tests
  - package.json
  - package-lock.json
  - playwright.config.cjs
