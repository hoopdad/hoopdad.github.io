<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 680" role="img" aria-labelledby="title desc"><title id="title">Underwriting routing and whole-workflow economics</title><desc id="desc">Cost splits and wall time are separate measures, computed from the same 22 historical pairs.</desc><rect width="840" height="680" fill="#fefdf8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="40" font-size="25" fill="#172337" text-anchor="start" font-weight="bold">A cheaper router is only part of the workflow</text><text x="35" y="70" font-size="17" fill="#172337" text-anchor="start" font-weight="normal">Saved evidence | 22 matched native pairs | same GPT workers</text><text x="35" y="115" font-size="20" fill="#172337" text-anchor="start" font-weight="bold">Mean model-inference cost per workflow (USD)</text><text x="35" y="177" font-size="17" fill="#172337" text-anchor="start" font-weight="normal">GPT routing</text><rect x="215" y="155" width="408.7241836363636363636363637" height="32" fill="#94a3b8"/><rect x="623.7241836363636363636363637" y="155" width="96.50053636363636363636363637" height="32" fill="#2563eb"/><text x="790" y="177" font-size="17" fill="#172337" text-anchor="end" font-weight="bold">$0.48</text><text x="215" y="211" font-size="16" fill="#172337" text-anchor="start" font-weight="normal">Router share: 19.10% of summed cost</text><text x="35" y="257" font-size="17" fill="#172337" text-anchor="start" font-weight="normal">Decision-1 routing</text><rect x="215" y="235" width="398.5252663636363636363636363" height="32" fill="#94a3b8"/><rect x="613.5252663636363636363636363" y="235" width="1.337494868181818181818181818" height="32" fill="#b45309"/><text x="790" y="257" font-size="17" fill="#172337" text-anchor="end" font-weight="bold">$0.38</text><text x="215" y="291" font-size="16" fill="#172337" text-anchor="start" font-weight="normal">Router share: 0.33% of summed cost</text><text x="35" y="335" font-size="17" fill="#172337" text-anchor="start" font-weight="normal">Gray = GPT workers; colored segment = routing</text><text x="35" y="380" font-size="20" fill="#172337" text-anchor="start" font-weight="bold">Mean end-to-end wall time (seconds)</text><text x="35" y="432" font-size="17" fill="#172337" text-anchor="start" font-weight="normal">GPT routing</text><rect x="215" y="410" width="464.2006011731818181818181819" height="32" fill="#2563eb"/><text x="790" y="432" font-size="17" fill="#172337" text-anchor="end" font-weight="bold">113.22 s</text><text x="35" y="497" font-size="17" fill="#172337" text-anchor="start" font-weight="normal">Decision-1 routing</text><rect x="215" y="475" width="408.4659996069954545454545455" height="32" fill="#b45309"/><text x="790" y="497" font-size="17" fill="#172337" text-anchor="end" font-weight="bold">99.63 s</text><text x="35" y="565" font-size="18" fill="#172337" text-anchor="start" font-weight="bold">Ratios of sums: 20.85% lower cost; 12.01% less time.</text><text x="35" y="598" font-size="16" fill="#172337" text-anchor="start" font-weight="normal">Historical operator prices; selected completions and internal repairs only.</text><text x="35" y="624" font-size="16" fill="#172337" text-anchor="start" font-weight="normal">Excludes evaluation, hosting, network, replaced attempts and human review.</text><text x="35" y="650" font-size="16" fill="#172337" text-anchor="start" font-weight="normal">Not production savings, repeat-run reliability or proof of equal answer quality.</text></g></svg>
