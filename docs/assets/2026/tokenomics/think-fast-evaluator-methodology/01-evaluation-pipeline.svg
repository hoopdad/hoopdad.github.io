<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" role="img" aria-labelledby="title" style="font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive"><title id="title">Blinded saved-answer evaluation design</title><rect width="600" height="550" fill="#fefdf8"/><defs>
<filter id="squiggle" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/></filter>
<marker id="ah-ink" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M1.5,1 L7.5,4.5 L1.5,8" fill="none" stroke="#37474f" stroke-width="1.6"
stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="300" y="30" font-size="18" fill="#263238" text-anchor="middle" font-weight="bold">Two judgments, one saved answer</text><text x="300" y="53" font-size="12" fill="#263238" text-anchor="middle" font-weight="normal">DESIGN / not an execution trace</text><g filter="url(#squiggle)" stroke-linecap="round" stroke-linejoin="round"><rect x="110" y="75" width="380" height="65" rx="6" fill="#eaf2fd" stroke="#2563eb" stroke-width="2"/><rect x="35" y="185" width="230" height="65" rx="6" fill="#f3ecfd" stroke="#7c3aed" stroke-width="2"/><rect x="335" y="185" width="230" height="65" rx="6" fill="#eaf7ec" stroke="#16a34a" stroke-width="2"/><rect x="110" y="295" width="380" height="65" rx="6" fill="#fff8d6" stroke="#eab308" stroke-width="2"/><rect x="110" y="405" width="380" height="65" rx="6" fill="#eaf2fd" stroke="#2563eb" stroke-width="2"/><path d="M220 146 Q150 160 150 178" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#ah-ink)"/><path d="M150 256 Q150 279 220 289" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#ah-ink)"/><path d="M380 146 Q450 160 450 178" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#ah-ink)"/><path d="M450 256 Q450 279 380 289" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#ah-ink)"/><path d="M300 366 Q300 382 300 398" fill="none" stroke="#37474f" stroke-width="2.2" marker-end="url(#ah-ink)"/></g><text x="300" y="100" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="normal">Freeze task + criteria + evidence</text><text x="300" y="123" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="normal">and the exact candidate answer</text><text x="150" y="210" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="normal">GPT judge</text><text x="150" y="233" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="normal">strict binary JSON</text><text x="450" y="210" font-size="13" fill="#14532d" text-anchor="middle" font-weight="normal">Decision-1 judge</text><text x="450" y="233" font-size="13" fill="#14532d" text-anchor="middle" font-weight="normal">fixed-choice scores</text><text x="300" y="320" font-size="13" fill="#92400e" text-anchor="middle" font-weight="normal">Validate completed binary votes</text><text x="300" y="343" font-size="13" fill="#92400e" text-anchor="middle" font-weight="normal">Keep failures and unknown costs separate</text><text x="300" y="430" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="normal">Compare; send questions to a person</text><text x="300" y="453" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="normal">Agreement does not establish correctness</text><text x="300" y="506" font-size="12" fill="#263238" text-anchor="middle" font-weight="normal">No router identity or previous votes in the packet.</text><text x="300" y="527" font-size="12" fill="#263238" text-anchor="middle" font-weight="normal">Same content; different native provider contracts.</text></svg>
