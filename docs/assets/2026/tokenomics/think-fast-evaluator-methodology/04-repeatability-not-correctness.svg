<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 455" role="img" aria-labelledby="title" style="font-family:Segoe UI,Arial,sans-serif"><title id="title">Three-pass repeatability on the 90 original disagreements</title><rect width="600" height="455" fill="#fefdf8"/><text x="28" y="35" font-size="24" fill="#263238" text-anchor="start" font-weight="bold">Repeatable does not mean correct</text><text x="28" y="68" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">Only the 90 original disagreements / three votes per model</text><text x="28" y="130" font-size="18" fill="#263238" text-anchor="start" font-weight="normal">GPT</text><rect x="145" y="110" width="300" height="32" rx="6" fill="#eef0ef" stroke="none" stroke-width="2"/><rect x="145" y="110" width="180.0" height="32" rx="6" fill="#7c3aed" stroke="none" stroke-width="2"/><text x="565" y="133" font-size="21" fill="#263238" text-anchor="end" font-weight="bold">54/90</text><text x="28" y="210" font-size="18" fill="#263238" text-anchor="start" font-weight="normal">Decision-1</text><rect x="145" y="190" width="300" height="32" rx="6" fill="#eef0ef" stroke="none" stroke-width="2"/><rect x="145" y="190" width="290.0" height="32" rx="6" fill="#16a34a" stroke="none" stroke-width="2"/><text x="565" y="213" font-size="21" fill="#263238" text-anchor="end" font-weight="bold">87/90</text><text x="28" y="290" font-size="23" fill="#263238" text-anchor="start" font-weight="bold">51 answers: both stable, but opposed</text><text x="28" y="332" font-size="21" fill="#263238" text-anchor="start" font-weight="normal">16/90 matching model majorities</text><text x="28" y="367" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">Unanimity means all three votes from that model match.</text><text x="28" y="398" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">Selected subset; not a new full-set agreement estimate.</text><text x="28" y="429" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">Original 360/450 agreement remains unchanged.</text></svg>
