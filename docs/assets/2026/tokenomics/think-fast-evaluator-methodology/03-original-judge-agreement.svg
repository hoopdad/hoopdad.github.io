<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 505" role="img" aria-labelledby="title" style="font-family:Segoe UI,Arial,sans-serif"><title id="title">Original evaluator agreement and disagreement matrix</title><rect width="600" height="505" fill="#fefdf8"/><text x="28" y="35" font-size="24" fill="#263238" text-anchor="start" font-weight="bold">Agreement includes shared rejection</text><text x="28" y="65" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">450 saved answers / one completed vote per evaluator</text><text x="390" y="107" font-size="19" fill="#263238" text-anchor="middle" font-weight="bold">Decision-1</text><text x="300" y="140" font-size="17" fill="#263238" text-anchor="middle" font-weight="normal">Accept</text><text x="470" y="140" font-size="17" fill="#263238" text-anchor="middle" font-weight="normal">Do not accept</text><text x="25" y="217" font-size="17" fill="#263238" text-anchor="start" font-weight="normal">GPT accept</text><rect x="225" y="160" width="155" height="90" rx="6" fill="#eaf7ec" stroke="none" stroke-width="2"/><text x="302" y="217" font-size="34" fill="#263238" text-anchor="middle" font-weight="bold">353</text><rect x="395" y="160" width="155" height="90" rx="6" fill="#fdf0e3" stroke="none" stroke-width="2"/><text x="472" y="217" font-size="34" fill="#263238" text-anchor="middle" font-weight="bold">27</text><text x="25" y="322" font-size="17" fill="#263238" text-anchor="start" font-weight="normal">GPT reject</text><rect x="225" y="265" width="155" height="90" rx="6" fill="#fdf0e3" stroke="none" stroke-width="2"/><text x="302" y="322" font-size="34" fill="#263238" text-anchor="middle" font-weight="bold">63</text><rect x="395" y="265" width="155" height="90" rx="6" fill="#eaf7ec" stroke="none" stroke-width="2"/><text x="472" y="322" font-size="34" fill="#263238" text-anchor="middle" font-weight="bold">7</text><text x="28" y="410" font-size="25" fill="#263238" text-anchor="start" font-weight="bold">360/450 agree = 80%</text><text x="28" y="445" font-size="18" fill="#263238" text-anchor="start" font-weight="normal">353 both accept + 7 both reject; 90 disagree.</text><text x="28" y="477" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">No independent correctness label is supplied by this matrix.</text></svg>
