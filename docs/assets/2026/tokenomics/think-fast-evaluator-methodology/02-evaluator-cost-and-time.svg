<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 605" role="img" aria-labelledby="title" style="font-family:Segoe UI,Arial,sans-serif"><title id="title">Paired evaluation cost and recorded elapsed, with coverage</title><rect width="600" height="605" fill="#fefdf8"/><text x="28" y="35" font-size="23" fill="#263238" text-anchor="start" font-weight="bold">Evaluation overhead, not workflow cost</text><text x="28" y="65" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">Original r6 saved answers / fixed study rate assumptions</text><text x="28" y="105" font-size="21" fill="#263238" text-anchor="start" font-weight="bold">Estimated inference cost</text><text x="28" y="133" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">378/450 same-answer pairs fully priced</text><text x="28" y="180" font-size="17" fill="#263238" text-anchor="start" font-weight="normal">GPT</text><rect x="145" y="160" width="300" height="29" rx="6" fill="#eef0ef" stroke="none" stroke-width="2"/><rect x="145" y="160" width="276.4095454545454545454545454" height="29" rx="6" fill="#7c3aed" stroke="none" stroke-width="2"/><text x="565" y="181" font-size="19" fill="#263238" text-anchor="end" font-weight="bold">$10.48</text><text x="28" y="240" font-size="17" fill="#263238" text-anchor="start" font-weight="normal">Decision-1</text><rect x="145" y="220" width="300" height="29" rx="6" fill="#eef0ef" stroke="none" stroke-width="2"/><rect x="145" y="220" width="2.968817421818181818181818180" height="29" rx="6" fill="#16a34a" stroke="none" stroke-width="2"/><text x="565" y="241" font-size="19" fill="#263238" text-anchor="end" font-weight="bold">$0.11</text><text x="28" y="320" font-size="21" fill="#263238" text-anchor="start" font-weight="bold">Mean recorded evaluation elapsed</text><text x="28" y="348" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">450/450 pairs timed; admission wait included</text><text x="28" y="395" font-size="17" fill="#263238" text-anchor="start" font-weight="normal">GPT</text><rect x="145" y="375" width="300" height="29" rx="6" fill="#eef0ef" stroke="none" stroke-width="2"/><rect x="145" y="375" width="268.3029678710222214102222222" height="29" rx="6" fill="#7c3aed" stroke="none" stroke-width="2"/><text x="565" y="396" font-size="19" fill="#263238" text-anchor="end" font-weight="bold">46.26 s</text><text x="28" y="455" font-size="17" fill="#263238" text-anchor="start" font-weight="normal">Decision-1</text><rect x="145" y="435" width="300" height="29" rx="6" fill="#eef0ef" stroke="none" stroke-width="2"/><rect x="145" y="435" width="131.6299330745333333333333333" height="29" rx="6" fill="#16a34a" stroke="none" stroke-width="2"/><text x="565" y="456" font-size="19" fill="#263238" text-anchor="end" font-weight="bold">22.69 s</text><text x="28" y="523" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">72 cost pairs incomplete; excluded, never priced as zero.</text><text x="28" y="550" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">Elapsed is not pure model latency or experiment wall time.</text><text x="28" y="577" font-size="16" fill="#263238" text-anchor="start" font-weight="normal">Excludes hosting, networking and human review/correction.</text></svg>
