<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
 role="img" aria-labelledby="title desc"
 style="font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive">
<title id="title">The learning loop around the agent workflow</title>
<desc id="desc">Define the bounded task, run a frozen cohort, evaluate against explicit criteria,
then inspect evidence and revise the responsible layer. Preserve original answers and votes.</desc>
<defs>
<filter id="squiggle" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/>
</filter>
<marker id="ah-0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M1.5,1 L7.5,4.5 L1.5,8" fill="none" stroke="#2563eb" stroke-width="1.6"
stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah-1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M1.5,1 L7.5,4.5 L1.5,8" fill="none" stroke="#7c3aed" stroke-width="1.6"
stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah-2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M1.5,1 L7.5,4.5 L1.5,8" fill="none" stroke="#ea580c" stroke-width="1.6"
stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah-3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M1.5,1 L7.5,4.5 L1.5,8" fill="none" stroke="#16a34a" stroke-width="1.6"
stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect width="600" height="400" fill="#fefdf8"/>
<text x="300" y="27" font-size="17" fill="#263238" font-weight="bold" text-anchor="middle">Improve the system, then test the change</text>
<g filter="url(#squiggle)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
<rect x="215" y="57" width="170" height="66" rx="6" fill="#eaf2fd" stroke="#2563eb"/>
<path d="M393 90 Q495 90 495 159" fill="none" stroke="#2563eb" marker-end="url(#ah-0)"/>
<path d="M240 87 Q300 91 360 87" fill="none" stroke="#2563eb"/>
<rect x="410" y="167" width="170" height="66" rx="6" fill="#f3ecfd" stroke="#7c3aed"/>
<path d="M495 241 Q495 310 393 310" fill="none" stroke="#7c3aed" marker-end="url(#ah-1)"/>
<path d="M435 197 Q495 201 555 197" fill="none" stroke="#7c3aed"/>
<rect x="215" y="277" width="170" height="66" rx="6" fill="#fdf0e3" stroke="#ea580c"/>
<path d="M207 310 Q105 310 105 241" fill="none" stroke="#ea580c" marker-end="url(#ah-2)"/>
<path d="M240 307 Q300 311 360 307" fill="none" stroke="#ea580c"/>
<rect x="20" y="167" width="170" height="66" rx="6" fill="#eaf7ec" stroke="#16a34a"/>
<path d="M105 159 Q105 90 207 90" fill="none" stroke="#16a34a" marker-end="url(#ah-3)"/>
<path d="M45 197 Q105 201 165 197" fill="none" stroke="#16a34a"/>
</g>
<text x="300" y="80" font-size="12" fill="#263238" font-weight="bold" text-anchor="middle">Define the task</text>
<text x="300" y="107" font-size="9.5" fill="#263238" font-weight="normal" text-anchor="middle">Scope, facts, authority</text>
<text x="495" y="190" font-size="12" fill="#263238" font-weight="bold" text-anchor="middle">Run a frozen cohort</text>
<text x="495" y="217" font-size="9.5" fill="#263238" font-weight="normal" text-anchor="middle">Keep failures and unknowns</text>
<text x="300" y="300" font-size="12" fill="#263238" font-weight="bold" text-anchor="middle">Evaluate the answer</text>
<text x="300" y="327" font-size="9.5" fill="#263238" font-weight="normal" text-anchor="middle">Explicit, separate checks</text>
<text x="105" y="190" font-size="12" fill="#263238" font-weight="bold" text-anchor="middle">Inspect and revise</text>
<text x="105" y="217" font-size="9.5" fill="#263238" font-weight="normal" text-anchor="middle">Fix the responsible layer</text>
<text x="300" y="193" font-size="12" fill="#263238" font-weight="normal" text-anchor="middle">Preserve each original</text>
<text x="300" y="215" font-size="12" fill="#263238" font-weight="normal" text-anchor="middle">answer and judgment</text>
<text x="300" y="380" font-size="11" fill="#263238" font-weight="normal" text-anchor="middle">Process design, not an execution trace or proof of correctness.</text>
</svg>
