<header class="editorial-header">
  <div class="header-inner">
    <a class="brand" rel="author" href="{{ '/' | relative_url }}" aria-label="hoopdad dunks home">
      <span class="brand-mark" aria-hidden="true">hd<span>.</span></span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <div class="header-actions">
      <a class="search-link" href="{{ '/search/' | relative_url }}" aria-label="Search articles">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <span>Search</span>
      </a>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z"/></svg>
      </button>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" hidden>Menu <span aria-hidden="true">+</span></button>
    </div>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      {% for topic in site.data.topics %}
        {% if topic.primary %}
          <a {% if page.topic == topic.key %}aria-current="page"{% endif %} href="{{ '/topics/' | append: topic.key | append: '/' | relative_url }}">{{ topic.title }}</a>
        {% endif %}
      {% endfor %}
      <a {% if page.url == "/series/" %}aria-current="page"{% endif %} href="{{ '/series/' | relative_url }}">Series</a>
      <details class="more-topics">
        <summary>More topics <span aria-hidden="true">&darr;</span></summary>
        <div class="topics-dropdown">
          {% for topic in site.data.topics %}
            {% unless topic.primary %}
              <a href="{{ '/topics/' | append: topic.key | append: '/' | relative_url }}">{{ topic.title }}</a>
            {% endunless %}
          {% endfor %}
          <a href="{{ '/archive/' | relative_url }}">All writing</a>
          <a href="{{ '/about/' | relative_url }}">About Mike</a>
        </div>
      </details>
    </nav>
  </div>
</header>
