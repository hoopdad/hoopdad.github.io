    attempt: 1
    enabled: true
    working_title: "A Complete Submission Is Not an Underwriting Decision"
    reader_question: "How do agents prepare a useful commercial submission without treating a declaration as verified evidence?"
    technical_angle: "Carry missing, conflicting and stale evidence through prerequisite-gated specialist handoffs."
    business_deliverable: "An evidence-linked advisory packet for an underwriter, not a quote, risk score or bind."
    outline:
      - "Follow one commercial submission from declared facts to exact evidence requests."
      - "Show how manual references, risk evidence and authority review depend on one another."
      - "Inspect a missing-evidence or stale-manual scenario alongside the simplest case."
      - "Explain routing economics without treating completion or evaluator agreement as acceptance of the applicant."
    implementation_paths:
